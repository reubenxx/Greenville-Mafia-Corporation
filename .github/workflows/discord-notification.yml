name: Discord Commit Logger

on:
  push:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Commit Embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMITS='${{ toJson(github.event.commits) }}'
          REPO='${{ github.repository }}'
          BRANCH='${{ github.ref_name }}'
          ACTOR='${{ github.actor }}'

          EMBEDS="[]"

          for row in $(echo "$COMMITS" | jq -r '.[] | @base64'); do
            _jq() {
              echo ${row} | base64 --decode | jq -r ${1}
            }

            MESSAGE=$(_jq '.message')
            URL=$(_jq '.url')
            ID=$(_jq '.id[:7]')

            ADDED=$(_jq '.added[]?' 2>/dev/null)
            REMOVED=$(_jq '.removed[]?' 2>/dev/null)
            MODIFIED=$(_jq '.modified[]?' 2>/dev/null)

            FILES=""

            if [ ! -z "$ADDED" ]; then
              while read line; do
                [ -z "$line" ] && continue
                FILES+="🟩 ${line}\\n"
              done <<< "$ADDED"
            fi

            if [ ! -z "$MODIFIED" ]; then
              while read line; do
                [ -z "$line" ] && continue
                FILES+="🟩 ${line}\\n"
              done <<< "$MODIFIED"
            fi

            if [ ! -z "$REMOVED" ]; then
              while read line; do
                [ -z "$line" ] && continue
                FILES+="🟥 ${line}\\n"
              done <<< "$REMOVED"
            fi

            PAYLOAD=$(jq -n \
              --arg repo "$REPO" \
              --arg branch "$BRANCH" \
              --arg actor "$ACTOR" \
              --arg msg "$MESSAGE" \
              --arg url "$URL" \
              --arg id "$ID" \
              --arg files "$FILES" \
              '{
                username: "GitHub",
                avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                embeds: [
                  {
          done
