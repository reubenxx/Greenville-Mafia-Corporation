name: Custom Discord Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Custom Webhook Notification
        uses: rjstone/discord-webhook-notify@v1.0.4
        with:
          severity: info
          username: "Novex"
          avatar_url: "https://imgur.com" # Optional: Link your custom avatar icon here
          color: "#2f3136"
          details: |
            **1 commit to [${{ github.repository }}](https://github.com{{ github.repository }})**
          text: |
            ```diff
            ${{ github.event.head_commit.message }}
            ```
          webhookUrl: "https://discord.com/api/webhooks/1505177047897604187/SYfdS7cgpvW0HAWfNE0Tu4NTYz6KvAO-rZMttA58dUMrGJOlVuCezXj3jzwsburzkwOQ"
