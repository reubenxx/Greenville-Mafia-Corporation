name: Discord Push Logger

on:
  push:

jobs:
  webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          COMMIT_ID="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"

          ADDED=$(jq -r '.head_commit.added[]?' "$GITHUB_EVENT_PATH")
          MODIFIED=$(jq -r '.head_commit.modified[]?' "$GITHUB_EVENT_PATH")
          REMOVED=$(jq -r '.head_commit.removed[]?' "$GITHUB_EVENT_PATH")

          DIFF=""

          for file in $ADDED; do
            DIFF="${DIFF}+ ${file}\n"
          done

          for file in $MODIFIED; do
            DIFF="${DIFF}+ ${file}\n"
          done

          for file in $REMOVED; do
            DIFF="${DIFF}- ${file}\n"
          done

          JSON=$(jq -n \
            --arg repo "$REPO" \
            --arg msg "$COMMIT_MSG" \
            --arg url "$COMMIT_URL" \
            --arg author "$AUTHOR" \
            --arg diff "$DIFF" \
            --arg id "${COMMIT_ID:0:7}" \
            '{
              username: "Global | Code Editor",
              embeds: [{
                color: 65280,
                author: {
                  name: $repo
                },
                description:
                  ("1 commit pushed\n```diff\n" + $diff + "```"),
                fields: [
                  {
                    name: "main",
                    value: $msg
                  }
                ],
                footer: {
                  text: ($id + " by " + $author)
                },
                url: $url
              }]
            }')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$JSON" \
               "$WEBHOOK"
