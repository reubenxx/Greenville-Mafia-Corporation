name: Discord Push Logger

on:
  push:

jobs:
  webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Discord Embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set +e

          echo "================ DEBUG START ================"

          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_ID="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"

          FILE_LINK="https://github.com/${REPO}/commit/${COMMIT_ID}"
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          echo "Commit: $COMMIT_ID"
          echo "Author: $AUTHOR"

          # SAFE DIFF (reliable in GitHub Actions)
          DIFF=$(git show "$COMMIT_ID" \
            | grep -E '^[+-]' \
            | grep -vE '^(---|\+\+\+)' \
            | head -c 3500 || true)

          if [ -z "$DIFF" ]; then
            DIFF="+ No code changes detected"
          fi

          ADDED=$(echo "$DIFF" | grep '^+' | grep -v '^+++' | wc -l | tr -d ' ')
          REMOVED=$(echo "$DIFF" | grep '^-' | grep -v '^---' | wc -l | tr -d ' ')

          echo "Added: $ADDED"
          echo "Removed: $REMOVED"

          # escape backticks only
          DIFF=$(printf "%s" "$DIFF" | sed 's/`/\\`/g')
          COMMIT_MSG=$(printf "%s" "$COMMIT_MSG" | sed 's/`/\\`/g')

          # BUILD DESCRIPTION SAFELY (NO YAML BREAKERS, NO jq CONCAT ISSUES)
          DESCRIPTION="**Committed to:** ${FILE_LINK}

Lines Added - ${ADDED}
Lines Removed - ${REMOVED}

```diff
${DIFF}
