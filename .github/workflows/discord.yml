name: Discord Push Logger

on:
  push:

jobs:
  webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Discord Embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          COMMIT_ID="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"

          DIFF=$(git diff HEAD^ HEAD | head -c 3500)

          if [ -z "$DIFF" ]; then
            DIFF="+ No code changes detected"
          fi

          JSON=$(jq -n \
            --arg repo "$REPO" \
            --arg msg "$COMMIT_MSG" \
            --arg url "$COMMIT_URL" \
            --arg author "$AUTHOR" \
            --arg diff "$DIFF" \
            --arg id "${COMMIT_ID:0:7}" \
            '{
              username: "Global | Code Editor",
              embeds: [{
                color: 65280,
                author: {
                  name: $repo
                },
                title: $msg,
                description:
                  ("```diff\n" + $diff + "\n```"),
                footer: {
                  text: ($id + " by " + $author)
                },
                url: $url
              }]
            }')

          curl \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$JSON" \
            "$WEBHOOK"
