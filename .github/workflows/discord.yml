name: Discord Push Logger

on:
  push:

jobs:
  webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Discord Embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set +e

          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_ID="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"

          FILES_CHANGED=$(git diff-tree --no-commit-id --name-only -r "$COMMIT_ID")

          FIRST_FILE=$(echo "$FILES_CHANGED" | head -n 1)

          # extract folder path (or repo root if none)
          FOLDER_PATH=$(dirname "$FIRST_FILE")
          if [ "$FOLDER_PATH" = "." ]; then
            FOLDER_URL="https://github.com/${REPO}"
          else
            FOLDER_URL="https://github.com/${REPO}/tree/main/${FOLDER_PATH}"
          fi

          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          DIFF=$(git show "$COMMIT_ID" \
            | grep -E '^[+-]' \
            | grep -vE '^(---|\+\+\+)' \
            | head -c 3500 || true)

          if [ -z "$DIFF" ]; then
            DIFF="+ No code changes detected"
          fi

          ADDED=$(echo "$DIFF" | grep '^+' | grep -v '^+++' | wc -l | tr -d ' ')
          REMOVED=$(echo "$DIFF" | grep '^-' | grep -v '^---' | wc -l | tr -d ' ')

          DIFF=$(printf "%s" "$DIFF" | sed 's/`/\\`/g')
          COMMIT_MSG=$(printf "%s" "$COMMIT_MSG" | sed 's/`/\\`/g')

          DESCRIPTION="**Committed to:** ${FOLDER_URL}

**Lines Added** - ${ADDED}
**Lines Removed** - ${REMOVED}

```diff
${DIFF}
