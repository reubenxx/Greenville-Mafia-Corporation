name: Discord Push Logger

on:
  push:

jobs:
  webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Discord Embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          COMMIT_ID="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"

          FILES_CHANGED=$(git diff --name-only HEAD^ HEAD | tr '\n' ', ')

          ADDED=$(git diff HEAD^ HEAD --unified=0 | grep '^+' | grep -v '^\+\+\+' | wc -l)
          REMOVED=$(git diff HEAD^ HEAD --unified=0 | grep '^-' | grep -v '^---' | wc -l)

          DIFF=$(git diff HEAD^ HEAD --unified=0 \
            | grep -E '^[+-]' \
            | grep -vE '^(---|\+\+\+)' \
            | head -c 3500)

          if [ -z "$DIFF" ]; then
            DIFF="+ No code changes detected"
          fi

          FILE_LINK="https://github.com/${REPO}/commit/${COMMIT_ID}"

          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          DIFF_ESCAPED=$(printf "%s" "$DIFF" | sed 's/`/\\`/g')
          MSG_ESCAPED=$(printf "%s" "$COMMIT_MSG" | sed 's/`/\\`/g')

          JSON=$(jq -n \
            --arg repo "$REPO" \
            --arg author "$AUTHOR" \
            --arg msg "$MSG_ESCAPED" \
            --arg diff "$DIFF_ESCAPED" \
            --arg file "$FILE_LINK" \
            --arg files "$FILES_CHANGED" \
            --arg added "$ADDED" \
            --arg removed "$REMOVED" \
            --arg time "$NOW" \
            --arg id "${COMMIT_ID:0:7}" \
            '{
              username: "Global | Code Editor",
              embeds: [{
                color: 0,
                description:
                  "**\($author)** has committed to [changed files](\($file))\n" +

                  "-------------------------------------------------------------------------------------------\n" +
                  "**Lines Added** - \($added)\n" +
                  "**Lines Removed** - \($removed)\n" +
                  "-------------------------------------------------------------------------------------------\n\n" +

                  "```diff\n\($diff)\n```\n\n" +

                  "-------------------------------------------------------------------------------------------\n" +
                  "```text\n\($msg)\n```\n\n" +

                  "-------------------------------------------------------------------------------------------",
                footer: {
                  text: ($author + " • " + $time)
                },
                url: $file
              }]
            }')

          curl \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$JSON" \
            "$WEBHOOK"
