name: Discord Push Logger

on:
  push:

jobs:
  webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Discord Embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set +e

          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_ID="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"

          FILE_LINK="https://github.com/${REPO}/commit/${COMMIT_ID}"
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          DIFF=$(git show "$COMMIT_ID" \
            | grep -E '^[+-]' \
            | grep -vE '^(---|\+\+\+)' \
            | head -c 3500)

          if [ -z "$DIFF" ]; then
            DIFF="+ No code changes detected"
          fi

          ADDED=$(echo "$DIFF" | grep '^+' | grep -v '^+++' | wc -l | tr -d ' ')
          REMOVED=$(echo "$DIFF" | grep '^-' | grep -v '^---' | wc -l | tr -d ' ')

          # escape safely
          DIFF=$(printf "%s" "$DIFF" | sed 's/`/\\`/g')
          COMMIT_MSG=$(printf "%s" "$COMMIT_MSG" | sed 's/`/\\`/g')

          # ✅ BUILD DESCRIPTION OUTSIDE jq (IMPORTANT FIX)
          DESCRIPTION="**Committed to:** ${FILE_LINK}

-----------------------------
**Lines Added** - ${ADDED}
**Lines Removed** - ${REMOVED}
-----------------------------

\`\`\`diff
${DIFF}
\`\`\`

-----------------------------

\`\`\`text
${COMMIT_MSG}
\`\`\`"

          JSON=$(jq -n \
            --arg author "$AUTHOR" \
            --arg url "$FILE_LINK" \
            --arg time "$NOW" \
            --arg id "${COMMIT_ID:0:7}" \
            --arg desc "$DESCRIPTION" \
            '{
              username: "Global | Code Editor",
              embeds: [{
                title: ($author + " committed changes"),
                url: $url,
                description: $desc,
                footer: {
                  text: ($author + " • " + $time + " • " + $id)
                }
              }]
            }')

          echo "Sending..."

          RESPONSE=$(curl -s -w "\nHTTP:%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$JSON" \
            "$WEBHOOK")

          echo "$RESPONSE"

          set -e
