name: Discord Push Logger

on:
  push:

jobs:
  webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Discord Embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e

          echo "================ DEBUG START ================"

          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_ID="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"

          FILE_LINK="https://github.com/${REPO}/commit/${COMMIT_ID}"
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          echo "Commit: $COMMIT_ID"
          echo "Author: $AUTHOR"

          # ✅ SAFE DIFF METHOD (always works in Actions)
          DIFF=$(git show "$COMMIT_ID" \
            | grep -E '^[+-]' \
            | grep -vE '^(---|\+\+\+)' \
            | head -c 3500 || true)

          if [ -z "$DIFF" ]; then
            DIFF="+ No code changes detected"
          fi

          echo "Diff size: $(echo "$DIFF" | wc -c)"

          ADDED=$(echo "$DIFF" | grep '^+' | grep -v '^+++' | wc -l | tr -d ' ')
          REMOVED=$(echo "$DIFF" | grep '^-' | grep -v '^---' | wc -l | tr -d ' ')

          echo "Added: $ADDED"
          echo "Removed: $REMOVED"

          # escape backticks only (safe minimal escaping)
          DIFF_ESCAPED=$(printf "%s" "$DIFF" | sed 's/`/\\`/g')
          MSG_ESCAPED=$(printf "%s" "$COMMIT_MSG" | sed 's/`/\\`/g')

          echo "Building JSON..."

          JSON=$(jq -n \
            --arg author "$AUTHOR" \
            --arg msg "$MSG_ESCAPED" \
            --arg diff "$DIFF_ESCAPED" \
            --arg url "$FILE_LINK" \
            --arg added "$ADDED" \
            --arg removed "$REMOVED" \
            --arg time "$NOW" \
            --arg id "${COMMIT_ID:0:7}" \
            '{
              username: "Global | Code Editor",
              embeds: [{
                title: ($author + " committed changes"),
                url: $url,
                description:
                  "**Committed to:** \($url)\n\n" +

                  "-------------------------------------------------------------------------------------------\n" +
                  "**Lines Added** - \($added)\n" +
                  "**Lines Removed** - \($removed)\n" +
                  "-------------------------------------------------------------------------------------------\n\n" +

                  "```diff\n\($diff)\n```\n\n" +

                  "-------------------------------------------------------------------------------------------\n" +

                  "```text\n\($msg)\n```\n\n" +

                  "-------------------------------------------------------------------------------------------",
                footer: {
                  text: ($author + " • " + $time + " • " + $id)
                }
              }]
            }')

          echo "Payload size: $(echo "$JSON" | wc -c)"

          echo "Sending to Discord..."

          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$JSON" \
            "$WEBHOOK")

          echo "Discord response:"
          echo "$RESPONSE"

          echo "================ DEBUG END ================"
