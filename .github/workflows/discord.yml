name: Discord Push Logger

on:
  push:

jobs:
  webhook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Discord Embed
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_URL="${{ github.event.head_commit.url }}"
          COMMIT_ID="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"

          ADDED=$(git diff --unified=0 HEAD^ HEAD \
            | grep '^+' \
            | grep -v '^+++' \
            | sed 's/^/+ /' \
            | head -c 1500)

          REMOVED=$(git diff --unified=0 HEAD^ HEAD \
            | grep '^-' \
            | grep -v '^---' \
            | sed 's/^/- /' \
            | head -c 1500)

          DIFF="${ADDED}
${REMOVED}"

          if [ -z "$DIFF" ]; then
            DIFF="+ No code changes detected"
          fi

          DESCRIPTION="```diff
${DIFF}

────────────────

Commit Message: ${COMMIT_MSG}
```"

          JSON=$(jq -n \
            --arg repo "$REPO" \
            --arg desc "$DESCRIPTION" \
            --arg url "$COMMIT_URL" \
            --arg author "$AUTHOR" \
            --arg id "${COMMIT_ID:0:7}" \
            '{
              username: "Global | Code Editor",
              embeds: [{
                color: 0,
                author: {
                  name: $repo
                },
                description: $desc,
                footer: {
                  text: ($id + " by " + $author)
                },
                url: $url
              }]
            }')

          curl \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$JSON" \
            "$WEBHOOK"
